
name: CI/CD

on:
  push:
    branches: 
      - main
 
  pull_request:
    branches:
      - main

jobs:
  test-build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ==========================
      # Backend
      # ==========================
      - name: Instalar dependências Backend
        working-directory: backend
        run: npm ci

      - name: Gerar Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Executar testes Backend
        working-directory: backend
        run: npm test

      # ==========================
      # Frontend
      # ==========================
      - name: Instalar dependências Frontend
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      # ==========================
      # Docker Hub
      # ==========================
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Backend Image
      - name: Build e Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/aluno-online-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/aluno-online-backend:${{ github.sha }}

      # Frontend Image
      - name: Build e Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/aluno-online-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/aluno-online-frontend:${{ github.sha }}

      # ==========================
      # Deploy Simulado
      # ==========================
      - name: Validar sucesso da pipeline
        run: |
          echo "Testes executados com sucesso"
          echo "Build realizado com sucesso"
          echo "Imagens publicadas no Docker Hub"

