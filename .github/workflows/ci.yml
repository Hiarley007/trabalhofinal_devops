name: CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  test-build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ==========================
      # Backend
      # ==========================
      - name: Instalar dependências Backend
        working-directory: aluno-online-react/backend
        run: npm ci

      - name: Gerar Prisma Client
        working-directory: aluno-online-react/backend
        run: npx prisma generate

      - name: Executar testes Backend
        working-directory: aluno-online-react/backend
        run: npm test

      # ==========================
      # Frontend
      # ==========================
      - name: Instalar dependências Frontend
        working-directory: aluno-online-react/frontend
        run: npm ci

      - name: Build Frontend
        working-directory: aluno-online-react/frontend
        run: npm run build

      # ==========================
      # Docker Hub
      # ==========================
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Backend Image
      - name: Build e Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./aluno-online-react/backend
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/aluno-online-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/aluno-online-backend:${{ github.sha }}

      # Frontend Image
      - name: Build e Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./aluno-online-react/frontend
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/aluno-online-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/aluno-online-frontend:${{ github.sha }}

      # ==========================
      # Deploy Simulado
      # ==========================
      - name: Validar sucesso da pipeline
        run: |
          echo "Testes executados com sucesso"
          echo "Build realizado com sucesso"
          echo "Imagens publicadas no Docker Hub"

  # ==========================
  # Rollback
  # ==========================
  rollback:
    runs-on: ubuntu-latest
    needs: test-build-and-publish
    if: failure()

    steps:
      - name: Rollback - restaurar versão anterior
        run: |
          echo "⚠️  Pipeline falhou! Iniciando rollback..."
          echo ""
          echo "Para restaurar a versão anterior manualmente, execute:"
          echo ""
          echo "  docker pull ${{ secrets.DOCKER_USERNAME }}/aluno-online-backend:${{ github.event.before }}"
          echo "  docker pull ${{ secrets.DOCKER_USERNAME }}/aluno-online-frontend:${{ github.event.before }}"
          echo ""
          echo "SHA com falha:   ${{ github.sha }}"
          echo "SHA anterior:    ${{ github.event.before }}"
          echo "Branch:          ${{ github.ref_name }}"
          echo "Acionado por:    ${{ github.actor }}"